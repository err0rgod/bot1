name: CI/CD Pipeline - Test, Smoke Test & Deploy to Lambda

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Continuous Integration (Runs on every PR and push to main)
  # ----------------------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock-access-key
          AWS_SECRET_ACCESS_KEY: mock-secret-key
          DYNAMODB_TABLE_NAME: zerodaily-articles
          TABLE_NAME: zerodaily-articles
          S3_IMAGE_BUCKET: zerodaily-media
          USE_BEDROCK: "true"
          DEEPSEEK_API_KEY: "mock-deepseek-key"
          FIRECRAWL_API_KEY: "mock-firecrawl-key"
        run: |
          pytest -v

  # ----------------------------------------------------------------------------
  # JOB 2: Continuous Deployment & Safe Promotion (Only triggers on tags like v1.0.0)
  # ----------------------------------------------------------------------------
  deploy:
    name: Build, Smoke Test & Deploy
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: zerodaily-scraper-pipeline
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          echo "Building Docker image for tag: $IMAGE_TAG..."
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:latest \
            --push .
          
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # ------------------------------------------------------------------------
      # STEP 1 OF DEPLOYMENT: Deploy to Test Lambda & Run Smoke Test
      # ------------------------------------------------------------------------
      - name: Deploy to Test Lambda
        run: |
          echo "Updating test Lambda (zerodaily-scraper-pipeline-test) with image: $IMAGE_URI"
          aws lambda update-function-code \
            --function-name zerodaily-scraper-pipeline-test \
            --image-uri $IMAGE_URI \
            --region us-east-1

      - name: Wait for Test Lambda Update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name zerodaily-scraper-pipeline-test \
            --region us-east-1

      - name: Smoke Test - Invoke Test Lambda
        run: |
          echo "Invoking test Lambda with sample payload..."
          aws lambda invoke \
            --function-name zerodaily-scraper-pipeline-test \
            --region us-east-1 \
            --payload '{"category": "ai"}' \
            --cli-binary-format raw-in-base64-out \
            smoke_test_response.json

          echo "Test Lambda Response:"
          cat smoke_test_response.json

          # Verify response does not contain an unhandled error or crash
          if grep -q "FunctionError" smoke_test_response.json || grep -q "errorMessage" smoke_test_response.json; then
            echo "[ERROR] Smoke test failed! The new image crashed or threw an error in the test Lambda."
            echo "Aborting deployment to production to keep your live scraper safe."
            exit 1
          fi

          echo "Smoke test passed cleanly!"

      # ------------------------------------------------------------------------
      # STEP 2 OF DEPLOYMENT: Promote to Production Lambda
      # ------------------------------------------------------------------------
      - name: Deploy to Production Lambda
        run: |
          echo "Promoting verified image to Production (zerodaily-scraper-pipeline)..."
          aws lambda update-function-code \
            --function-name zerodaily-scraper-pipeline \
            --image-uri $IMAGE_URI \
            --region us-east-1

      - name: Wait for Production Lambda Update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name zerodaily-scraper-pipeline \
            --region us-east-1
          echo "[SUCCESS] Production deployment successful and active!"
